    </aside>

    <!-- 中间：选中期的正文 -->

          <button class="tb-btn" id="nextBtn" type="button" rel="next">下一期 →</button>
        </div>
      </div>
      <div class="report-host" id="reportHost">

    <!-- 右侧：正文小标题大纲 -->

    </aside>
  </div>

  <script>
    // === 期数数据（按时间正序：旧 → 新）===
    const ISSUES = [
      { id: '39', file: 'issues/issue-2026-W39.html', title: '2026年第39期', sub: '试看版 · V1', date: '2026-09-24' },
      { id: '40', file: 'issues/issue-2026-W40.html', title: '2026年第40期', sub: '每周试运行 · 第2期', date: '2026-09-29' },
      { id: '41', file: 'issues/issue-2026-41.html',  title: '2026年第41期', sub: '每周试运行 · 第3期', date: '2026-10-09' },
      { id: '42', file: 'issues/issue-2026-42.html',  title: '2026年第42期', sub: '每周试运行 · 第4期', date: '2026-10-10' },
    ];
    const NEWEST_ID = ISSUES[ISSUES.length - 1].id;

    const $list = document.getElementById('issueList');
    const $host = document.getElementById('reportHost');
    const $toc  = document.getElementById('toc');
    const $state = document.getElementById('stateBox');
    const $curLabel = document.getElementById('curLabel');
    const $prevBtn = document.getElementById('prevBtn');
    const $nextBtn = document.getElementById('nextBtn');

    let currentId = null;
    let spy = null;

    // === 渲染左侧历史列表（最新在前）===
    function renderList() {
      const html = [...ISSUES].reverse().map(it => {
        const isNewest = it.id === NEWEST_ID;
        return `<li data-id="${it.id}">
          <a href="#issue-${it.id}">
            <span class="il-date">${it.date}</span>
            <span class="il-title">${it.title}${isNewest ? '<span class="il-badge">最新</span>' : ''}</span>
            <span class="il-sub">${it.sub}</span>
          </a>
        </li>`;
      }).join('');
      $list.innerHTML = html;
    }

    function setActiveList(id) {
      [...$list.children].forEach(li => {
        li.classList.toggle('active', li.dataset.id === id);
      });
    }

    function setToolbar(id) {
      const idx = ISSUES.findIndex(i => i.id === id);
      const it = ISSUES[idx];
      $curLabel.textContent = it ? `${it.title}（${it.date}）` : '—';
      $prevBtn.disabled = idx <= 0;
      $nextBtn.disabled = idx >= ISSUES.length - 1;
      $prevBtn.textContent = idx > 0 ? `← 上一期（${ISSUES[idx-1].title}）` : '← 已是最早';
      $nextBtn.textContent = idx < ISSUES.length - 1 ? `下一期（${ISSUES[idx+1].title}）→` : '已是最新 →';
    }

    // === 从期 HTML 文档中提取 <article class="page"> ===
    function extractArticle(doc) {
      return doc.querySelector('article.page');
    }

    // === 根据正文 section 生成右侧大纲 ===
    function buildToc(articleEl) {
      const targets = [];
      articleEl.querySelectorAll('main > section[id]').forEach(sec => {
        const h2 = sec.querySelector('h2');
        if (!h2) return;
        const no = h2.querySelector('.sec-no');
        targets.push({
          id: sec.id,
          no: no ? no.textContent.trim() : '',
          text: h2.textContent.replace(no ? no.textContent : '', '').trim(),
        });
      });
      // 来源（sources-wrap），无 id 则补一个
      const sources = articleEl.querySelector('footer.sources-wrap');
      if (sources) {
        if (!sources.id) sources.id = 'sources';
        const h2 = sources.querySelector('h2');
        targets.push({ id: sources.id, no: '附', text: h2 ? h2.textContent.trim() : '来源' });
      }

      if (!targets.length) {
        $toc.innerHTML = '<li class="toc-empty">未找到章节</li>';
        return [];
      }
      $toc.innerHTML = targets.map(t =>
        `<li><a href="#${t.id}"><span class="toc-no">${t.no}</span>${t.text}</a></li>`
      ).join('');
      return targets;
    }

    // === 滚动监听：高亮当前章节 ===
    function setupScrollSpy(articleEl) {
      if (spy) spy.disconnect();
      const sections = [...articleEl.querySelectorAll('main > section[id], footer.sources-wrap[id]')];
      if (!sections.length) return;
      const links = new Map();
      $toc.querySelectorAll('a').forEach(a => {
        const id = a.getAttribute('href').slice(1);
        links.set(id, a.closest('li'));
      });
      spy = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            const li = links.get(e.target.id);
            if (li) {
              $toc.querySelectorAll('li').forEach(x => x.classList.remove('active'));
              li.classList.add('active');
            }
          }
        });
      }, { rootMargin: '0px 0px -75% 0px', threshold: 0 });
      sections.forEach(s => spy.observe(s));
    }

    // === 大纲点击：平滑滚动到对应章节（不修改 hash，避免与期数路由冲突）===
    $toc.addEventListener('click', (e) => {
      const a = e.target.closest('a[href^="#"]');
      if (!a) return;
      e.preventDefault();
      const id = a.getAttribute('href').slice(1);
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    function showState(msg, isError) {
      $host.innerHTML = '';
      const box = document.createElement('div');
      box.className = 'state' + (isError ? ' state--error' : '');
      box.textContent = msg;
      $host.appendChild(box);
    }

    // === 加载并渲染某一期 ===
    async function loadIssue(id, { scroll = true } = {}) {
      const it = ISSUES.find(i => i.id === id);
      if (!it) { showState('未找到该期：' + id, true); return; }
      if (currentId === id && $host.dataset.loaded === '1') return;
      currentId = id;
      setActiveList(id);
      setToolbar(id);
      showState('正在加载 ' + it.title + ' …');
      try {
        const res = await fetch(it.file, { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const article = extractArticle(doc);
        if (!article) throw new Error('未找到正文 <article class="page">');
        $host.innerHTML = '';
        $host.appendChild(article);
        // 修正相对路径：issue 文件在 issues/ 子目录，SPA 注入到 index.html 根目录
        article.querySelectorAll('img[src^="../"]').forEach(img => {
          img.src = img.getAttribute('src').replace(/^\.\.\//, '');
        });
        $host.dataset.loaded = '1';
        buildToc(article);
        setupScrollSpy(article);
        if (scroll) window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        $host.dataset.loaded = '0';
        showState('加载失败：' + err.message + '（可直接打开 ' + it.file + ' 查看）', true);
      }
    }

    // === 上一期 / 下一期 ===
    function shiftIssue(delta) {
      const idx = ISSUES.findIndex(i => i.id === currentId);
      const next = ISSUES[idx + delta];
      if (next) location.hash = 'issue-' + next.id;
    }
    $prevBtn.addEventListener('click', () => shiftIssue(-1));
    $nextBtn.addEventListener('click', () => shiftIssue(1));

    // === 哈希路由：#issue-41 ===
    function parseHash() {
      const m = /^#issue-(.+)$/.exec(location.hash);
      return m ? m[1] : null;
    }
    function routeFromHash() {
      const id = parseHash();
      const target = id && ISSUES.find(i => i.id === id) ? id : NEWEST_ID;
      loadIssue(target);
    }
    window.addEventListener('hashchange', routeFromHash);

    // === 启动 ===
    renderList();
    routeFromHash();
  </script>
</body>
</html>
